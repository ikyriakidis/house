@media (prefers-color-scheme: dark) {

  }
}
:root[data-theme="dark"] {
  --paper: #151b1d; --sheet: #1b2326; --ink: #e3e9e6; --ink-soft: #9aa7a8; --rule: #34403f; --accent: #e58a63;

* { box-sizing: border-box; }
body {

  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-family: var(--f-display); font-stretch: 72%; font-weight: 750; font-size: clamp(30px, 5vw, 46px); line-height: 1; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-soft); margin: 6px 0 0; max-width: 70ch; }
.sub a { color: var(--accent); }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 12px 16px; border-bottom: 1px solid var(--rule); align-items: center; }
.lab { font-family: var(--f-display); font-stretch: 80%; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 650; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
button.chip {
  font: 500 13px var(--f-body); color: var(--ink); background: transparent; border: 1px solid var(--rule);
  border-radius: 999px; padding: 4px 11px; cursor: pointer;
}
button.chip:hover { border-color: var(--ink-soft); }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#view { position: relative; height: min(74vh, 800px); min-height: 440px; background: #cfe0ea; touch-action: none; }
#view canvas { display: block; width: 100%; height: 100%; }
.hint { position: absolute; left: 12px; bottom: 10px; font-family: var(--f-mono); font-size: 11.5px; color: #33424a; background: rgba(251, 252, 250, .8); padding: 3px 8px; border-radius: 3px; pointer-events: none; }
.caption { padding: 10px 16px; border-top: 1px solid var(--rule); font-size: 13.5px; color: var(--ink-soft); min-height: 44px; }
.caption b { color: var(--ink); }
.err { padding: 24px; color: #33424a; }

// ---------- Walls: sampled from the room map, so shared edges become one wall ----------
function roomAt(x, y) {
  if (x < 0 || x > W || y < 0 || y > D) return null;
  for (const rm of ROOMS) for (const [rx, ry, rw, rd] of rm.r)
    if (x > rx && x < rx + rw && y > ry && y < ry + rd) return rm.id;
  return null;
}
const isOpen = (a, b) => OPEN.has([a, b].sort().join("|"));
const near = (a, b) => Math.abs(a - b) < 1e-6;
function openingAt(horizontal, line, pos) {
  const hit = (a, b, c, d) => horizontal ? (near(b, line) && near(d, line) && pos > Math.min(a, c) && pos < Math.max(a, c))
                                         : (near(a, line) && near(c, line) && pos > Math.min(b, d) && pos < Math.max(b, d));
  for (const dr of DOORS) if (hit(...dr)) return { kind: "door", sub: dr[4] || "" };
  if (hit(...GARAGE_DOOR)) return { kind: "garage" };
  for (const wn of WINDOWS) if (hit(...wn)) return { kind: "win", sill: wn[4] };
  return null;
}
const wallGroup = new THREE.Group(); scene.add(wallGroup);
function buildWalls(cut) {

      const piece = (from, to, base, h, depth, material, cast = true) => {
        if (h <= 0.001 || to - from <= 0.001) return;
        const o = { group: wallGroup, cast };
        if (horizontal) box(from, line - depth / 2, to - from, depth, h, base, material, o);
        else box(line - depth / 2, from, depth, to - from, h, base, material, o);
      };
      if (!op) piece(a - ext, b + ext, 0, H, t, mat.wall);
      else if (op.kind === "door") {
        if (!cut) piece(a, b, 2.1, H - 2.1, t, mat.wall);
        if (op.sub === "front" && !cut) piece(a + 0.02, b - 0.02, 0, 2.1, 0.06, mat.darkWood);
        if (op.sub === "service" && !cut) piece(a + 0.02, b - 0.02, 0, 2.1, 0.06, mat.frame);
      } else if (op.kind === "garage") {
        if (!cut) piece(a, b, 2.4, H - 2.4, t, mat.wall);

        piece(a, b, op.sill, hiTop - op.sill, 0.03, mat.glass, false);
        if (!cut) piece(a, b, top, H - top, t, mat.wall);

        const fd = Math.min(t, 0.12), fw = 0.05;

        const parts = Math.max(1, Math.ceil((b - a) / (op.sill === 0 ? 1.6 : 1.2)));

      let key = null, t = 0, op = null;

  vs.forEach(x => scan(false, x));
  if (!cut) {
    box(4.1, -1.4, 2.3, 1.4, 0.14, 2.6, mat.render, { group: wallGroup });       // porch canopy over the front door
    box(7.05, 0.2, 5.4, 2.3, 0.05, 2.35, mat.frame, { group: wallGroup });       // garage sectional door, open
  }
}
